<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница артиста - Василёк</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #5A87D0;
            --secondary-color: #9d79d0;
            --tertiary-color: #64b58e;
            --background-color: #121212;
            --surface-color: #1a1a1a;
            --surface-highlight-color: #242424;
            --text-color: #ffffff;
            --text-muted-color: #b3b3b3;
            --text-artist-color: #e0e0e0;
            --border-color: #2f2f2f;
            --danger-color: #dc3545;
            --sidebar-width: 260px;
            --player-height: 90px;
            --navbar-height: 85px;
        }
        html { box-sizing: border-box; }
        *, *::before, *::after { box-sizing: inherit; }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            padding-top: var(--navbar-height);
            padding-bottom: var(--player-height);
            display: flex;
            overflow-x: hidden;
        }
        .navbar { position: fixed; top: 0; left: 0; right: 0; height: var(--navbar-height); background-color: rgba(20, 20, 20, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; z-index: 1000; border-bottom: 1px solid var(--primary-color); backdrop-filter: blur(5px); }
        .navbar-logo a { display: flex; align-items: center; }
        .navbar-logo img { height: 70px; width: auto; }
        .navbar-links { display: flex; align-items: center; gap: 1rem; }
        .user-dropdown { position: relative; display: inline-block; }
        #user-menu-button { background: none; border: none; color: var(--text-muted-color); cursor: pointer; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 20px; transition: background-color 0.2s, color 0.2s; }
        #user-menu-button:hover, .user-dropdown.active #user-menu-button { background-color: var(--surface-color); color: var(--text-color); }
        .dropdown-arrow { font-size: 0.8em; transition: transform 0.2s ease-in-out; }
        .user-dropdown.active .dropdown-arrow { transform: rotate(180deg); }
        .dropdown-content { display: none; position: absolute; background-color: var(--surface-color); min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4); z-index: 1; border-radius: 8px; padding: 0.5rem 0; right: 0; top: 120%; border: 1px solid var(--border-color); }
        .dropdown-content a { color: var(--text-artist-color); padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; }
        .dropdown-content a:hover { background-color: var(--surface-highlight-color); color: var(--primary-color); }
        .main-layout-container { display: flex; width: 100%; flex-grow: 1; }
        .sidebar { width: var(--sidebar-width); background-color: var(--surface-color); padding: 1.5rem 0; height: calc(100vh - 70px - var(--player-height)); overflow-y: auto; position: fixed; top: 70px; left: 0; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .sidebar-section { margin-bottom: 1.5rem; }
        .sidebar-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted-color); padding: 0 1.5rem; margin-bottom: 0.75rem; font-weight: bold; letter-spacing: 0.5px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 0.75rem 1.5rem; color: var(--text-artist-color); text-decoration: none; font-size: 0.95rem; transition: background-color 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active-sidebar-link { background-color: var(--surface-highlight-color); color: var(--primary-color); font-weight: bold; border-left-color: var(--primary-color); }
        .sidebar-menu li a i { margin-right: 1rem; width: 20px; text-align: center; color: var(--text-muted-color); }
        .sidebar-menu li a:hover i, .sidebar-menu li a.active-sidebar-link i { color: var(--primary-color); }
        .content { flex-grow: 1; padding: 2rem; margin-left: var(--sidebar-width); overflow-y: auto; overflow-x: hidden; width: calc(100% - var(--sidebar-width)); }
        .artist-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-color); }
        .artist-info { flex-grow: 1; }
        .artist-info h1 { font-size: 3rem; margin: 0 0 1rem 0; line-height: 1.1; }
        .subscribe-button { background-color: var(--primary-color); color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .subscribe-button:hover { background-color: #4a77c0; transform: scale(1.05); }
        .subscribe-button.subscribed { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted-color); }
        .subscribe-button.subscribed:hover { border-color: var(--danger-color); color: var(--danger-color); background-color: rgba(220, 53, 69, 0.1); transform: scale(1.05); }
        .subscribe-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .tabs-container { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
        .tab-button { padding: 0.75rem 1.5rem; cursor: pointer; background: none; border: none; color: var(--text-muted-color); font-size: 1rem; font-weight: 500; position: relative; transition: color 0.2s; }
        .tab-button.active { color: var(--primary-color); }
        .tab-button.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .track-list-container { display: flex; flex-direction: column; gap: 0.75rem; }
        .track-card { background-color: var(--surface-color); border-radius: 8px; padding: 0.75rem 1rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); transition: all 0.2s ease-in-out; border: 1px solid var(--border-color); display: flex; align-items: center; width: 100%; min-height: 80px; }
        .track-card:hover { background-color: var(--surface-highlight-color); border-left: 3px solid var(--primary-color); padding-left: calc(1rem - 3px); }
        .track-cover { width: 50px; height: 50px; min-width: 50px; flex-shrink: 0; background-size: cover; background-position: center; border-radius: 6px; background-color: #222; margin-right: 1rem; }
        .track-details-wrapper { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; margin-right: 1rem; }
        .track-info-primary h3 { margin: 0 0 0.1rem 0; font-size: 1rem; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info-primary p.artist-name a { color: var(--text-artist-color); text-decoration: none; }
        .track-stats-info { display: flex; align-items: center; font-size: 0.75rem; color: var(--text-muted-color); gap: 0.75rem; margin-top: 0.3rem; }
        .track-actions-group { display: flex; align-items: center; flex-shrink: 0; }
        .track-actions-group .play-button { background-color: var(--primary-color); color: white; border: none; padding: 0.6rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: background-color 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .track-actions-group .icon-button { background: none; border: none; color: var(--text-muted-color); font-size: 1.1rem; cursor: pointer; padding: 0.4rem; border-radius: 50%; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
        .track-actions-group .icon-button:hover { color: var(--primary-color); background-color: rgba(90, 135, 208, 0.1); transform: scale(1.1); }
        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .album-card { background-color: var(--surface-color); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; text-align: center; border: 1px solid transparent; text-decoration: none; color: inherit; transition: all 0.2s; }
        .album-card:hover { background-color: var(--surface-highlight-color); transform: translateY(-5px); border-color: var(--border-color); }
        .album-card .album-cover { width: 100%; padding-bottom: 100%; background-size: cover; background-position: center; background-color: #333; border-radius: 6px; margin-bottom: 0.75rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .album-card .album-title { font-size: 1rem; font-weight: bold; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card .album-artist { font-size: 0.85rem; color: var(--text-muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 550px) {
            .track-actions-group .play-button .play-button-text {
                display: none;
            }
            .track-actions-group .play-button {
                width: 38px;
                height: 38px;
                padding: 0;
                gap: 0;
            }
        }
        .player { position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height); background-color: #1c1c1c; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 1000; }
        .player-info { display: flex; align-items: center; min-width: 200px; flex-shrink: 0; }
        .player-image { width: 50px; height: 50px; border-radius: 4px; margin-right: 1rem; object-fit: cover; background-color: #333; }
        .player-text { display: flex; flex-direction: column; overflow: hidden;}
        .player-title { font-size: 0.9rem; font-weight: 500; color: var(--text-color); margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-artist { font-size: 0.8rem; color: var(--text-muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-controls { display: flex; flex-direction: column; align-items: center; flex-grow: 1; margin: 0 1rem; min-width: 250px; max-width: 600px; }
        .player-buttons { display: flex; align-items: center; margin-bottom: 0.5rem; }
        .player-button { background: none; border: none; color: var(--text-muted-color); font-size: 1.1rem; cursor: pointer; padding: 0.5rem; transition: color 0.2s; }
        .player-button:hover { color: var(--text-color); }
        .player-button.play { font-size: 1.5rem; color: var(--text-color); }
        .player-button.play:hover { color: var(--primary-color); }
        .player-button.active-control { color: var(--primary-color); }
        .player-progress { display: flex; align-items: center; width: 100%; }
        .progress-time { font-size: 0.75rem; color: var(--text-muted-color); margin: 0 0.5rem; }
        .progress-bar { flex-grow: 1; height: 4px; background-color: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; width: 0%; background-color: var(--primary-color); border-radius: 2px; }
        .player-volume { display: flex; align-items: center; min-width: 120px; justify-content: flex-end; flex-shrink: 0;}
        .volume-icon { color: var(--text-muted-color); margin-right: 0.75rem; font-size: 1rem; }
        .volume-bar { width: 80px; height: 4px; background-color: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .volume-fill { height: 100%; width: 70%; background-color: var(--text-color); border-radius: 2px; }
        .message-area { margin-bottom: 1rem; }
        .message { padding: .75rem; border-radius: 6px; font-size: .9rem; display: none; text-align: center; border: 1px solid;}
        .error { background-color: rgba(90, 135, 208, 0.2); color: var(--primary-color); border-color: var(--primary-color); }
        .success { background-color: rgba(100, 181, 142, 0.2); color: var(--tertiary-color); border-color: var(--tertiary-color); }
        .no-results-placeholder { text-align: center; color: #777; padding: 3rem; border: 2px dashed #333; border-radius: 8px; margin-top: 2rem; }
        .no-results-placeholder i { font-size: 3rem; margin-bottom: 1rem; display: block; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">
        <a href="main.html"><img src="images/logooo.png" alt="Василёк Logo"></a>
    </div>
    <div class="navbar-links">
        <div class="user-dropdown">
            <button id="user-menu-button" class="navbar-user-greeting">
                <span id="nav-user-greeting">Привет, ...</span>
                <i class="fas fa-chevron-down dropdown-arrow"></i>
            </button>
            <div id="user-dropdown-content" class="dropdown-content">
                <a href="settings.html"><i class="fas fa-user-cog"></i> Настройки</a>
                <a href="#" id="logout-link"><i class="fas fa-sign-out-alt"></i> Выйти</a>
            </div>
        </div>
    </div>
</nav>

<div class="main-layout-container">
    <aside class="sidebar" id="main-sidebar">
    </aside>

    <main class="content">
        <div id="artist-content-container">
            <div class="artist-header">
                <div class="artist-info">
                    <h1 id="artist-name">Загрузка...</h1>
                    <button id="subscribe-btn" class="subscribe-button" disabled>
                        <i class="fas fa-rss"></i>
                        <span>Подписаться</span>
                    </button>
                </div>
            </div>

            <div class="message-area" id="global-message-area"></div>

            <div class="tabs-container">
                <button class="tab-button active" data-tab="tracks-view">Треки</button>
                <button class="tab-button" data-tab="albums-view">Альбомы</button>
            </div>

            <div id="content-views">
                <div id="tracks-view" class="tab-content active">
                    <div id="track-list-container" class="track-list-container"></div>
                    <div id="no-tracks-message" class="no-results-placeholder" style="display: none;">
                        <i class="fas fa-compact-disc"></i>
                        <p>У этого артиста пока нет треков.</p>
                    </div>
                </div>
                <div id="albums-view" class="tab-content">
                    <div id="album-grid-container" class="album-grid"></div>
                    <div id="no-albums-message" class="no-results-placeholder" style="display: none;">
                        <i class="fas fa-record-vinyl"></i>
                        <p>У этого артиста пока нет альбомов.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="player">
    <div class="player-info"> <img src="images/default-cover.png" alt="Track cover" class="player-image" id="player-current-cover"> <div class="player-text"> <div class="player-title" id="player-current-title">Название трека</div> <div class="player-artist" id="player-current-artist">Исполнитель</div> </div> </div> <div class="player-controls"> <div class="player-buttons"> <button class="player-button" id="player-shuffle" title="Перемешать"><i class="fas fa-random"></i></button> <button class="player-button" id="player-prev" title="Предыдущий трек"><i class="fas fa-step-backward"></i></button> <button class="player-button play" id="player-play-pause" title="Воспроизвести/Пауза"><i class="fas fa-play"></i></button> <button class="player-button" id="player-next" title="Следующий трек"><i class="fas fa-step-forward"></i></button> <button class="player-button" id="player-repeat" title="Повтор выключен"><i class="fas fa-redo"></i></button> </div> <div class="player-progress"> <span class="progress-time" id="player-current-time">0:00</span> <div class="progress-bar" id="player-progress-bar"> <div class="progress-fill" id="player-progress-fill"></div> </div> <span class="progress-time" id="player-duration">0:00</span> </div> </div> <div class="player-volume"> <i class="fas fa-volume-up volume-icon" id="player-volume-icon"></i> <div class="volume-bar" id="player-volume-bar"> <div class="volume-fill" id="player-volume-fill"></div> </div> </div>
</div>

<script>
    let currentUser = null;
    const API_BASE_URL = "http://localhost:8080";
    let currentAudio = new Audio();
    let currentTrackList = [];
    let currentTrackIndex = -1;
    let isShuffle = false;
    let repeatMode = 0;
    const artistNameEl = document.getElementById('artist-name');
    const subscribeBtn = document.getElementById('subscribe-btn');
    const tabsContainer = document.querySelector('.tabs-container');
    const trackListContainer = document.getElementById('track-list-container');
    const albumGridContainer = document.getElementById('album-grid-container');
    const noTracksMessage = document.getElementById('no-tracks-message');
    const noAlbumsMessage = document.getElementById('no-albums-message');
    const playerElements = { playPauseBtn: document.getElementById('player-play-pause'), prevBtn: document.getElementById('player-prev'), nextBtn: document.getElementById('player-next'), shuffleBtn: document.getElementById('player-shuffle'), repeatBtn: document.getElementById('player-repeat'), progressBar: document.getElementById('player-progress-bar'), progressFill: document.getElementById('player-progress-fill'), currentTimeEl: document.getElementById('player-current-time'), durationEl: document.getElementById('player-duration'), volumeBar: document.getElementById('player-volume-bar'), volumeFill: document.getElementById('player-volume-fill'), volumeIcon: document.getElementById('player-volume-icon'), currentCover: document.getElementById('player-current-cover'), currentTitle: document.getElementById('player-current-title'), currentArtist: document.getElementById('player-current-artist') };

    document.addEventListener('DOMContentLoaded', async function() {
        const token = localStorage.getItem("jwtToken");
        if (!token) { window.location.href = "/login.html"; return; }

        const urlParams = new URLSearchParams(window.location.search);
        const artistId = urlParams.get('id');
        if (!artistId) {
            displayGlobalMessage("ID артиста не найден в URL.", "error");
            artistNameEl.textContent = "Артист не найден";
            return;
        }

        try {
            currentUser = await fetchData("/api/users/me", "Ошибка загрузки профиля");
            if (currentUser) {
                setupLayoutUI(currentUser);
                await loadArtistPageData(artistId);
                setupPlayerControls();
                setupEventListeners(artistId);
            }
        } catch (error) {
            displayGlobalMessage(error.message, 'error');
            document.getElementById('artist-content-container').innerHTML = `<p>Не удалось загрузить страницу.</p>`;
        }
    });

    function setupEventListeners(artistId) {
        tabsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-button')) {
                const targetTab = e.target.dataset.tab;
                tabsContainer.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(targetTab).classList.add('active');
            }
        });

        subscribeBtn.addEventListener('click', () => handleSubscriptionClick(artistId));
    }

    async function loadArtistPageData(artistId) {
        try {
            const [artistData, artistTracks, artistAlbums, mySubscriptions] = await Promise.all([
                fetchData(`/api/users/${artistId}`, "Ошибка загрузки данных артиста"),
                fetchData(`/api/tracks/artist/${artistId}`, "Ошибка загрузки треков артиста"),
                fetchData(`/api/albums/artist/${artistId}`, "Ошибка загрузки альбомов артиста"),
                fetchData(`/api/artist-subscriptions/my`, "Ошибка загрузки подписок")
            ]);

            currentTrackList = artistTracks;

            const isSubscribed = mySubscriptions.some(sub => sub.artistId == artistId);
            renderArtistHeader(artistData, isSubscribed);
            displayTracks(artistTracks);
            displayAlbums(artistAlbums);
        } catch (error) {
            displayGlobalMessage(error.message, 'error');
            artistNameEl.textContent = "Не удалось загрузить данные";
        }
    }

    function renderArtistHeader(artist, isSubscribed) {
        artistNameEl.textContent = artist.name;
        document.title = `${artist.name} - Василёк`;

        if (currentUser && currentUser.id == artist.id) {
            subscribeBtn.style.display = 'none';
        } else {
            subscribeBtn.style.display = 'inline-flex';
            subscribeBtn.disabled = false;
            updateSubscriptionButton(isSubscribed);
        }
    }

    function updateSubscriptionButton(isSubscribed) {
        subscribeBtn.dataset.subscribed = isSubscribed;
        subscribeBtn.classList.toggle('subscribed', isSubscribed);
        if (isSubscribed) {
            subscribeBtn.querySelector('span').textContent = 'Вы подписаны';
            subscribeBtn.querySelector('i').className = 'fas fa-check';
        } else {
            subscribeBtn.querySelector('span').textContent = 'Подписаться';
            subscribeBtn.querySelector('i').className = 'fas fa-rss';
        }
    }

    async function handleSubscriptionClick(artistId) {
        const isSubscribed = subscribeBtn.dataset.subscribed === 'true';
        subscribeBtn.disabled = true;

        try {
            if (isSubscribed) {
                await fetchData(`/api/artist-subscriptions?artistId=${artistId}`, "Ошибка отписки", { method: 'DELETE' });
                displayGlobalMessage("Вы отписались от исполнителя.", "success");
                updateSubscriptionButton(false);
            } else {
                const body = { artist: { id: artistId } };
                await fetchData('/api/artist-subscriptions', "Ошибка подписки", { method: 'POST', body: JSON.stringify(body) });
                displayGlobalMessage("Вы подписались на исполнителя!", "success");
                updateSubscriptionButton(true);
            }
        } catch (error) {
            displayGlobalMessage(error.message, 'error');
        } finally {
            if(currentUser && currentUser.id != artistId) subscribeBtn.disabled = false;
        }
    }

    function displayTracks(tracks) {
        trackListContainer.innerHTML = '';
        noTracksMessage.style.display = (!tracks || tracks.length === 0) ? 'block' : 'none';
        if (!tracks) return;

        tracks.forEach((track, index) => {
            const coverUrl = track.coverPath ? `${API_BASE_URL}${track.coverPath}` : 'images/default-cover.png';
            const trackCardHTML = `
                <div class="track-card" data-track-id="${track.id}" data-track-index="${index}">
                    <div class="track-cover" style="background-image: url('${coverUrl}')"></div>
                    <div class="track-details-wrapper">
                        <div class="track-info-primary">
                            <h3>${track.title || 'Без названия'}</h3>
                        </div>
                        <div class="track-stats-info">
                            <span class="stats-item"><i class="fas fa-headphones"></i> ${track.listensCount || 0}</span>
                            <span class="stats-item"><i class="fas fa-heart"></i> ${track.likesCount || 0}</span>
                        </div>
                    </div>
                    <div class="track-actions-group">
                        <button class="play-button">
                            <i class="fas fa-play"></i>
                            <span class="play-button-text">Play</span>
                        </button>
                    </div>
                </div>`;
            trackListContainer.insertAdjacentHTML('beforeend', trackCardHTML);
        });

        trackListContainer.querySelectorAll('.play-button').forEach(button => {
            button.addEventListener('click', () => playTrackFromList(parseInt(button.closest('.track-card').dataset.trackIndex), tracks));
        });
    }

    function displayAlbums(albums) {
        albumGridContainer.innerHTML = '';
        noAlbumsMessage.style.display = (!albums || albums.length === 0) ? 'block' : 'none';
        if (!albums) return;

        albums.forEach(album => {
            const coverUrl = (album.tracks && album.tracks.length > 0 && album.tracks[0].coverPath) ? `${API_BASE_URL}${album.tracks[0].coverPath}` : 'images/default-cover.png';
            albumGridContainer.innerHTML += `
                <a href="album-detail.html?id=${album.id}" class="album-card">
                    <div class="album-cover" style="background-image: url('${coverUrl}')"></div>
                    <div class="album-title">${album.name}</div>
                    <div class="album-artist">${album.artistName}</div>
                </a>`;
        });
    }

    function setupLayoutUI(user) {
        document.getElementById('nav-user-greeting').textContent = `Привет, ${user.name}!`;
        setupDropdownMenu();
        renderSidebar(user);
        highlightActiveSidebarLink();
    }
    function setupDropdownMenu() {
        const btn = document.getElementById('user-menu-button'), content = document.getElementById('user-dropdown-content'), link = document.getElementById('logout-link');
        if(btn) btn.addEventListener('click', e => { e.stopPropagation(); btn.parentElement.classList.toggle('active'); content.style.display = btn.parentElement.classList.contains('active') ? 'block' : 'none'; });
        if(link) link.addEventListener('click', e => { e.preventDefault(); localStorage.removeItem("jwtToken"); window.location.href = "/login.html"; });
        window.addEventListener('click', e => { if (btn && !btn.contains(e.target) && btn.parentElement.classList.contains('active')) { btn.parentElement.classList.remove('active'); content.style.display = 'none'; } });
    }
    function renderSidebar(user) {
        const container = document.getElementById('main-sidebar');
        if(!container || !user) return;
        const isArtist = user.role === 'ARTIST';
        container.innerHTML = `
            <div class="sidebar-section">
                <ul class="sidebar-menu"><li><a href="main.html"><i class="fas fa-home"></i> <span>Главная</span></a></li></ul>
            </div>
            <div class="sidebar-section">
                <h3 class="sidebar-title">Моя медиатека</h3>
                <ul class="sidebar-menu">
                    <li><a href="my-playlists.html"><i class="fas fa-list"></i> <span>Мои плейлисты</span></a></li>
                    <li><a href="liked-tracks.html"><i class="fas fa-heart"></i> <span>Понравившиеся</span></a></li>
                    <li><a href="subscriptions.html"><i class="fas fa-rss"></i> <span>Мои подписки</span></a></li>
                </ul>
            </div>
            ${isArtist ? `
            <div class="sidebar-section" id="artist-section-sidebar">
                <h3 class="sidebar-title">Артисту</h3>
                <ul class="sidebar-menu">
                    <li><a href="my-tracks-artist.html"><i class="fas fa-music"></i> <span>Мои треки</span></a></li>
                    <li><a href="my-albums-artist.html"><i class="fas fa-compact-disc"></i> <span>Мои альбомы</span></a></li>
                    <li><a href="artist-stats.html"><i class="fas fa-chart-line"></i> <span>Статистика</span></a></li>
                </ul>
            </div>` : ''}
        `;
    }
    function highlightActiveSidebarLink() {
        const activeLink = document.querySelector('.sidebar-menu a[href="main.html"]');
        if (activeLink) {
            activeLink.classList.add('active-sidebar-link');
        }
    }
    function displayGlobalMessage(message, type = 'success') {
        const area = document.getElementById('global-message-area');
        if(area) { area.innerHTML = `<div class="message ${type}" style="display:block;">${message}</div>`; setTimeout(() => { area.innerHTML = ''; }, 5000); }
    }
    async function fetchData(endpoint, errorMessagePrefix = "Ошибка", options = {}) {
        const token = localStorage.getItem("jwtToken");
        if (!token) { window.location.href = "/login.html"; throw new Error("Токен авторизации не найден."); }
        const fetchOptions = { ...options, headers: { 'Authorization': `Bearer ${token}`, ...(options.headers || {}) } };
        if (options.body && typeof options.body === 'string' && !fetchOptions.headers['Content-Type']) fetchOptions.headers['Content-Type'] = 'application/json';
        try {
            const response = await fetch(`${API_BASE_URL}${endpoint}`, fetchOptions);
            if (response.status === 401) { localStorage.removeItem("jwtToken"); window.location.href = "/login.html"; throw new Error("Сессия истекла."); }
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ message: `${errorMessagePrefix}: ${response.status}` }));
                throw new Error(errorData.data?.message || errorData.message);
            }
            if (response.headers.get("content-length") === "0") return [];
            return await response.json();
        } catch (error) { console.error(`Ошибка fetchData для ${endpoint}:`, error); throw error; }
    }

    function setupPlayerControls() { if (!playerElements.playPauseBtn) return; playerElements.playPauseBtn.addEventListener('click', togglePlayPause); playerElements.nextBtn.addEventListener('click', playNextTrack); playerElements.prevBtn.addEventListener('click', playPrevTrack); playerElements.shuffleBtn.addEventListener('click', toggleShuffle); playerElements.repeatBtn.addEventListener('click', cycleRepeatMode); currentAudio.addEventListener('loadedmetadata', updatePlayerDuration); currentAudio.addEventListener('timeupdate', updatePlayerProgress); currentAudio.addEventListener('ended', handleTrackEnd); currentAudio.addEventListener('play', () => playerElements.playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>'); currentAudio.addEventListener('pause', () => playerElements.playPauseBtn.innerHTML = '<i class="fas fa-play"></i>'); playerElements.progressBar.addEventListener('click', seekTrack); playerElements.volumeBar.addEventListener('click', setVolume); currentAudio.volume = 0.7; playerElements.volumeFill.style.width = (currentAudio.volume * 100) + '%'; updateVolumeIcon(currentAudio.volume); }
    function playTrackFromList(index, trackList = currentTrackList) { if (index < 0 || index >= trackList.length) return; currentTrackIndex = index; const track = trackList[currentTrackIndex]; if (!track || !track.filePath || !track.artist || !track.artist.name) return; const token = localStorage.getItem("jwtToken"); fetch(`${API_BASE_URL}/api/tracks/${track.id}/listen`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } }).catch(console.error); currentAudio.src = `${API_BASE_URL}${track.filePath}`; currentAudio.play().catch(console.error); updatePlayerUI(track); }
    function updatePlayerUI(track) { if (!playerElements.currentCover || !track) return; if (track) { playerElements.currentCover.src = track.coverPath ? `${API_BASE_URL}${track.coverPath}` : 'images/default-cover.png'; playerElements.currentTitle.textContent = track.title || 'Без названия'; playerElements.currentArtist.textContent = track.artist?.name || 'Неизвестный'; } else { playerElements.currentCover.src = 'images/default-cover.png'; playerElements.currentTitle.textContent = 'Название трека'; playerElements.currentArtist.textContent = 'Исполнитель'; } }
    function togglePlayPause() { if (!currentAudio.src && currentTrackList.length > 0) { playTrackFromList(0); return; } if (currentAudio.paused) currentAudio.play(); else currentAudio.pause(); }
    function playNextTrack() { if (currentTrackList.length === 0) return; let nextIndex = isShuffle ? Math.floor(Math.random() * currentTrackList.length) : (currentTrackIndex + 1) % currentTrackList.length; playTrackFromList(nextIndex); }
    function playPrevTrack() { if (currentTrackList.length === 0) return; if (currentAudio.currentTime > 3 || currentTrackIndex === -1) { if (currentTrackIndex !== -1) currentAudio.currentTime = 0; else if (currentTrackList.length > 0) playTrackFromList(0); } else { let prevIndex = isShuffle ? Math.floor(Math.random() * currentTrackList.length) : (currentTrackIndex - 1 + currentTrackList.length) % currentTrackList.length; playTrackFromList(prevIndex); } }
    function handleTrackEnd() { if (repeatMode === 2) { currentAudio.currentTime = 0; currentAudio.play(); } else if (repeatMode === 1) playNextTrack(); else { if (isShuffle || (currentTrackIndex !== -1 && currentTrackIndex < currentTrackList.length - 1)) playNextTrack(); else playerElements.playPauseBtn.innerHTML = '<i class="fas fa-play"></i>'; } }
    function updatePlayerDuration() { if (playerElements.durationEl && !isNaN(currentAudio.duration)) playerElements.durationEl.textContent = formatTime(currentAudio.duration); }
    function updatePlayerProgress() { if (playerElements.progressFill && playerElements.currentTimeEl && !isNaN(currentAudio.duration) && currentAudio.duration > 0) { playerElements.currentTimeEl.textContent = formatTime(currentAudio.currentTime); playerElements.progressFill.style.width = `${(currentAudio.currentTime / currentAudio.duration) * 100}%`; } }
    function formatTime(s) { return isNaN(s) ? "0:00" : `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }
    function seekTrack(e) { if (!currentAudio.src || isNaN(currentAudio.duration)) return; const r = playerElements.progressBar.getBoundingClientRect(); currentAudio.currentTime = ((e.clientX - r.left) / r.width) * currentAudio.duration; }
    function setVolume(e) { const r = playerElements.volumeBar.getBoundingClientRect(); let v = (e.clientX - r.left) / r.width; v = Math.max(0, Math.min(1, v)); currentAudio.volume = v; playerElements.volumeFill.style.width = `${v * 100}%`; updateVolumeIcon(v); }
    function updateVolumeIcon(v) { if (!playerElements.volumeIcon) return; playerElements.volumeIcon.className = v === 0 ? 'fas fa-volume-mute volume-icon' : (v < 0.5 ? 'fas fa-volume-down volume-icon' : 'fas fa-volume-up volume-icon'); }
    function toggleShuffle() { isShuffle = !isShuffle; playerElements.shuffleBtn.classList.toggle('active-control', isShuffle); }
    function cycleRepeatMode() { repeatMode = (repeatMode + 1) % 3; playerElements.repeatBtn.innerHTML = ['<i class="fas fa-redo"></i>', '<i class="fas fa-redo-alt"></i>', '<i class="fas fa-retweet"></i>'][repeatMode]; playerElements.repeatBtn.classList.toggle('active-control', repeatMode !== 0); }
</script>
