<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Василёк</title>
    <style>
        :root {
            --primary-color: #5A87D0;
            --secondary-color: #9d79d0;
            --tertiary-color: #64b58e;
            --background-color: #121212;
            --surface-color: #1a1a1a;
            --surface-highlight-color: #242424;
            --text-color: #ffffff;
            --text-muted-color: #b3b3b3;
            --border-color: #2f2f2f;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(26, 26, 26, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            z-index: 1000;
            border-bottom: 1px solid var(--primary-color);
            backdrop-filter: blur(5px);
        }
        .navbar-logo a { display: flex; align-items: center; }
        .navbar-logo img {
            height: 65px;
            width: auto;
        }
        .navbar-links {
            display: flex;
            gap: 1.5rem;
        }
        .navbar-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }
        .navbar-links a:hover {
            color: var(--primary-color);
        }
        .navbar-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }
        .navbar-links a:hover::after {
            width: 100%;
        }

        .container {
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(90, 135, 208, 0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 80px;
            border: 1px solid var(--border-color);
            animation: pulse 8s infinite ease-in-out;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            position: relative;
            display: inline-block;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 3px;
            background-color: var(--primary-color);
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--surface-highlight-color);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .password-toggle {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin: 5px 0 15px;
            color: var(--text-muted-color);
            font-size: 0.9rem;
            cursor: pointer;
        }
        .password-toggle input[type="checkbox"] {
            width: auto;
            margin: 0 8px 0 0;
            cursor: pointer;
        }
        .password-toggle label {
            cursor: pointer;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(90, 135, 208, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #4a77c0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(90, 135, 208, 0.3);
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .message {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            border-width: 1px;
            border-style: solid;
        }
        .text-link {
            margin-top: 15px;
            font-size: 14px;
        }
        .text-link a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s;
        }
        .text-link a:hover {
            text-decoration: underline;
        }

        .success {
            background-color: rgba(100, 181, 142, 0.15);
            color: var(--tertiary-color);
            border-color: var(--tertiary-color);
        }
        .error {
            background-color: rgba(220, 53, 69, 0.15);
            color: #dc3545;
            border-color: #dc3545;
        }

        @keyframes pulse {
            0% { box-shadow: 0 8px 20px rgba(90, 135, 208, 0.1); }
            50% { box-shadow: 0 8px 25px rgba(90, 135, 208, 0.15); }
            100% { box-shadow: 0 8px 20px rgba(90, 135, 208, 0.1); }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-logo">
        <a href="main.html"><img src="images/logooo.png" alt="Василёк Logo"></a>
    </div>
    <div class="navbar-links">
        <a href="login.html">Вход</a>
        <a href="register.html">Регистрация</a>
    </div>
</nav>
<div class="container">
    <h1>Вход в Василёк</h1>
    <div id="message" class="message"></div>

    <form id="login-form">
        <input type="email" id="email" name="email" placeholder="Электронная почта" required>
        <input type="password" id="password" name="password" placeholder="Пароль" required>

        <div class="password-toggle">
            <input type="checkbox" id="show-password">
            <label for="show-password">Показать пароль</label>
        </div>

        <button type="submit" id="submit-btn">Войти</button>
    </form>

    <p class="text-link">
        <a href="verify-email.html">Подтвердить почту?</a> •
        <a href="forgot-password.html">Забыли пароль?</a>
    </p>
</div>

<script>
    document.getElementById('show-password').addEventListener('change', function() {
        const passwordField = document.getElementById('password');
        passwordField.type = this.checked ? 'text' : 'password';
    });

    document.getElementById("login-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const data = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };
        const messageElement = document.getElementById("message");
        const submitBtn = document.getElementById("submit-btn");

        messageElement.style.display = "none";
        submitBtn.disabled = true;

        try {
            const response = await fetch("http://localhost:8080/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.data?.message || "Неверные учетные данные или аккаунт не подтвержден.");
            }

            messageElement.textContent = "Успешный вход! Перенаправляем...";
            messageElement.className = "message success";
            messageElement.style.display = "block";

            localStorage.setItem("jwtToken", result.data.token);

            setTimeout(() => {
                window.location.href = "/main.html";
            }, 1500);

        } catch (error) {
            localStorage.removeItem("jwtToken");
            messageElement.textContent = "Ошибка: " + error.message;
            messageElement.className = "message error";
            messageElement.style.display = "block";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
