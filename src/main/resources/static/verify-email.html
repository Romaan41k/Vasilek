<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение почты - Rhythmix</title>
    <style>
        /* Основные стили */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f0f0f;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Навигационная панель */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(15, 15, 15, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            z-index: 1000;
            border-bottom: 1px solid #ff2a2a;
        }

        .navbar-logo img {
            height: 40px;
            width: auto;
        }

        .navbar-links {
            display: flex;
            gap: 1.5rem;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .navbar-links a:hover {
            color: #ff2a2a;
        }

        .navbar-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #ff2a2a;
            transition: width 0.3s;
        }

        .navbar-links a:hover::after {
            width: 100%;
        }

        /* Контейнер формы */
        .container {
            background-color: #181818;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(255, 42, 42, 0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 80px;
            border: 1px solid #2a2a2a;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 1.5rem;
            color: #fff;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
            width: 100%;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 330px;
            height: 3px;
            background-color: #ff2a2a;
        }

        /* Элементы формы */
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background-color: #222;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ff2a2a;
            box-shadow: 0 0 0 2px rgba(255, 42, 42, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #ff2a2a;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #ff1a1a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 42, 42, 0.3);
        }

        /* Сообщения */
        .message {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .success {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }

        .error {
            background-color: rgba(255, 42, 42, 0.2);
            color: #ff2a2a;
            border: 1px solid #ff2a2a;
        }

        /* Анимации */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .container {
            animation: pulse 6s infinite ease-in-out;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-logo">
        <img src="images/logooo.png" alt="Rhythmix Logo">
    </div>
    <div class="navbar-links">
        <a href="/login">Вход</a>
        <a href="/register">Регистрация</a>
    </div>
</nav>
<div class="container">
    <h1>Подтвердите вашу почту</h1>
    <div id="message" class="message" style="display: none;"></div>

    <form id="verify-form">
        <input type="email" id="email" name="email" placeholder="Ваш email" required>
        <input type="text" id="verificationCode" name="verificationCode" placeholder="Код подтверждения" required>
        <button type="submit">Подтвердить</button>
    </form>
</div>

<script>
    document.getElementById("verify-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const data = {
            email: document.getElementById("email").value,
            verificationCode: document.getElementById("verificationCode").value
        };

        try {
            const response = await fetch("http://localhost:8080/auth/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageElement = document.getElementById("message");

            if (response.ok) {
                messageElement.textContent = "Почта успешно подтверждена! Перенаправляем...";
                messageElement.className = "message success";
                messageElement.style.display = "block";

                setTimeout(() => {
                    window.location.href = "/login";
                }, 3000);
            } else {
                messageElement.textContent = "Ошибка: " + (result.message || "Неверный код подтверждения");
                messageElement.className = "message error";
                messageElement.style.display = "block";
            }
        } catch (error) {
            const messageElement = document.getElementById("message");
            messageElement.textContent = "Ошибка сети: " + error.message;
            messageElement.className = "message error";
            messageElement.style.display = "block";
        }
    });
</script>
</body>
</html>
