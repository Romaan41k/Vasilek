<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента и подписки - Василёк</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #5A87D0; --secondary-color: #9d79d0; --tertiary-color: #64b58e;
            --background-color: #121212; --surface-color: #1a1a1a; --surface-highlight-color: #242424;
            --text-color: #ffffff; --text-muted-color: #b3b3b3; --text-artist-color: #e0e0e0;
            --border-color: #2f2f2f; --danger-color: #dc3545; --sidebar-width: 260px;
            --player-height: 90px; --navbar-height: 85px;
        }
        html { box-sizing: border-box; }
        *, *::before, *::after { box-sizing: inherit; }
        body { font-family: 'Arial', sans-serif; background-color: var(--background-color); color: var(--text-color); margin: 0; padding: 0; padding-top: var(--navbar-height); padding-bottom: var(--player-height); display: flex; overflow-x: hidden; }
        .navbar { position: fixed; top: 0; left: 0; right: 0; height: var(--navbar-height); background-color: rgba(20, 20, 20, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; z-index: 1000; border-bottom: 1px solid var(--primary-color); backdrop-filter: blur(5px); }
        .navbar-logo a { display: flex; align-items: center; }
        .navbar-logo img { height: 70px; width: auto; }
        .user-dropdown { position: relative; display: inline-block; }
        #user-menu-button { background: none; border: none; color: var(--text-muted-color); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 20px; transition: all 0.2s; }
        #user-menu-button:hover, .user-dropdown.active #user-menu-button { background-color: var(--surface-color); color: var(--text-color); }
        .dropdown-arrow { transition: transform 0.2s; }
        .user-dropdown.active .dropdown-arrow { transform: rotate(180deg); }
        .dropdown-content { display: none; position: absolute; background-color: var(--surface-color); min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4); z-index: 1; border-radius: 8px; padding: 0.5rem 0; right: 0; top: 120%; border: 1px solid var(--border-color); }
        .dropdown-content a { color: var(--text-artist-color); padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; }
        .dropdown-content a:hover { background-color: var(--surface-highlight-color); color: var(--primary-color); }
        .main-layout-container { display: flex; width: 100%; flex-grow: 1; }
        .sidebar { width: var(--sidebar-width); background-color: var(--surface-color); padding: 1.5rem 0; height: calc(100vh - var(--navbar-height) - var(--player-height)); overflow-y: auto; position: fixed; top: var(--navbar-height); left: 0; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .sidebar-section { margin-bottom: 1.5rem; }
        .sidebar-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted-color); padding: 0 1.5rem; margin-bottom: 0.75rem; font-weight: bold; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 0.75rem 1.5rem; color: var(--text-artist-color); text-decoration: none; font-size: 0.95rem; transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active-sidebar-link { background-color: var(--surface-highlight-color); color: var(--primary-color); font-weight: bold; border-left-color: var(--primary-color); }
        .sidebar-menu li a i { margin-right: 1rem; width: 20px; text-align: center; color: var(--text-muted-color); transition: color 0.2s; }
        .sidebar-menu li a:hover i, .sidebar-menu li a.active-sidebar-link i { color: var(--primary-color); }
        .content { flex-grow: 1; padding: 2rem; margin-left: var(--sidebar-width); overflow-y: auto; width: calc(100% - var(--sidebar-width)); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        .page-header h1 { color: var(--primary-color); font-size: 2rem; margin: 0; }
        #back-to-subs-btn { background-color: var(--surface-highlight-color); border: 1px solid var(--border-color); color: var(--text-muted-color); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
        #back-to-subs-btn:hover { color: white; border-color: var(--primary-color); }
        .tabs-container { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
        .tab-button { padding: 0.75rem 1.5rem; cursor: pointer; background: none; border: none; color: var(--text-muted-color); font-size: 1rem; font-weight: 500; position: relative; transition: color 0.2s; }
        .tab-button.active { color: var(--primary-color); }
        .tab-button.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background-color: var(--primary-color); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .subscriptions-list, .track-list-container, #feed-container { display: flex; flex-direction: column; gap: 0.75rem; }
        .subscription-card { background-color: var(--surface-color); border-radius: 8px; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; border: 1px solid var(--border-color); transition: background-color 0.2s; }
        .subscription-card .details { flex-grow: 1; cursor: pointer; }
        .subscription-card .details .name { font-size: 1.1rem; color: var(--text-color); text-decoration: none; }
        .subscription-card .details .name:hover { text-decoration: underline; color: var(--primary-color); }
        .subscription-card .unsubscribe-button { background-color: var(--surface-highlight-color); border: 1px solid var(--border-color); color: var(--text-muted-color); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
        .subscription-card .unsubscribe-button:hover { color: white; border-color: var(--danger-color); background-color: rgba(220, 53, 69, 0.2); }
        .track-card { background-color: var(--surface-color); border-radius: 8px; padding: 0.75rem 1rem; display: flex; align-items: center; border: 1px solid var(--border-color); }
        .track-cover { width: 50px; height: 50px; min-width: 50px; flex-shrink: 0; background-size: cover; background-position: center; border-radius: 6px; background-color: #222; margin-right: 1rem; }
        .track-details-wrapper { flex-grow: 1; min-width: 0; }
        .track-info-primary h3 { margin: 0 0 0.1rem 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info-primary .artist-name a { color: var(--text-artist-color); text-decoration: none; }
        .track-stats-info { display: flex; font-size: 0.75rem; color: var(--text-muted-color); gap: 0.75rem; margin-top: 0.3rem; }
        .track-actions-group { display: flex; align-items: center; margin-left: auto; }
        .play-button { background-color: var(--primary-color); color: white; border: none; padding: 0.6rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; }
        .play-button i { margin-right: 5px; }
        .no-results-placeholder { text-align: center; color: #777; padding: 3rem; border: 2px dashed #333; border-radius: 8px; margin-top: 2rem; }
        .no-results-placeholder i { font-size: 3rem; margin-bottom: 1rem; display: block; }
        .feed-item { margin-bottom: 1.5rem; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color);}
        .feed-item-header { padding: 0.75rem 1.25rem; font-size: 0.9rem; color: var(--text-muted-color); border-bottom: 1px solid var(--border-color); background-color: rgba(255,255,255,0.03); }
        .feed-item-header i { margin-right: 0.5rem; }
        .feed-item > .track-card, .feed-item > a { border: none; border-radius: 0; text-decoration: none; color: inherit; }
        .player { position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height); background-color: #1c1c1c; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 1000; }
        .player-info { display: flex; align-items: center; min-width: 200px; flex-shrink: 0; }
        .player-image { width: 50px; height: 50px; border-radius: 4px; margin-right: 1rem; object-fit: cover; background-color: #333; }
        .player-text { display: flex; flex-direction: column; overflow: hidden;}
        .player-title { font-size: 0.9rem; font-weight: 500; color: var(--text-color); margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-artist { font-size: 0.8rem; color: var(--text-muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-controls { display: flex; flex-direction: column; align-items: center; flex-grow: 1; margin: 0 1rem; min-width: 250px; max-width: 600px; }
        .player-buttons { display: flex; align-items: center; margin-bottom: 0.5rem; }
        .player-button { background: none; border: none; color: var(--text-muted-color); font-size: 1.1rem; cursor: pointer; padding: 0.5rem; transition: color 0.2s; }
        .player-button.play { font-size: 1.5rem; color: var(--text-color); }
        .player-button.active-control { color: var(--primary-color); }
        .player-progress { display: flex; align-items: center; width: 100%; }
        .progress-time { font-size: 0.75rem; color: var(--text-muted-color); margin: 0 0.5rem; }
        .progress-bar { flex-grow: 1; height: 4px; background-color: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; width: 0%; background-color: var(--primary-color); border-radius: 2px; }
        .player-volume { display: flex; align-items: center; min-width: 120px; justify-content: flex-end; flex-shrink: 0;}
        .volume-icon { color: var(--text-muted-color); margin-right: 0.75rem; font-size: 1rem; }
        .volume-bar { width: 80px; height: 4px; background-color: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .volume-fill { height: 100%; width: 70%; background-color: var(--text-color); border-radius: 2px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">
        <a href="main.html"><img src="images/logooo.png" alt="Василёк Logo"></a>
    </div>
    <div class="navbar-links">
        <div class="user-dropdown">
            <button id="user-menu-button">
                <span id="nav-user-greeting">Привет, ...</span>
                <i class="fas fa-chevron-down dropdown-arrow"></i>
            </button>
            <div id="user-dropdown-content" class="dropdown-content">
                <a href="settings.html"><i class="fas fa-user-cog"></i> Настройки</a>
                <a href="#" id="logout-link"><i class="fas fa-sign-out-alt"></i> Выйти</a>
            </div>
        </div>
    </div>
</nav>

<div class="main-layout-container">
    <aside class="sidebar" id="main-sidebar"></aside>

    <main class="content">
        <div class="page-header">
            <h1 id="page-title">Лента и подписки</h1>
            <button id="back-to-subs-btn" style="display: none;"><i class="fas fa-arrow-left"></i> Назад</button>
        </div>

        <div id="main-view">
            <div class="tabs-container">
                <button class="tab-button active" data-tab="feed-view">Лента</button>
                <button class="tab-button" data-tab="artists-view">Исполнители</button>
                <button class="tab-button" data-tab="genres-view">Жанры</button>
            </div>
            <div id="content-views">
                <div id="feed-view" class="tab-content active">
                    <div id="feed-container"></div>
                    <div id="no-feed-message" class="no-results-placeholder" style="display: none;">
                        <i class="fas fa-wind"></i><p>В вашей ленте пока пусто.</p>
                    </div>
                </div>
                <div id="artists-view" class="tab-content">
                    <div id="artist-subscriptions-container" class="subscriptions-list"></div>
                    <div id="no-artist-subscriptions" class="no-results-placeholder" style="display: none;">
                        <i class="fas fa-users-slash"></i><p>Нет подписок на исполнителей.</p>
                    </div>
                </div>
                <div id="genres-view" class="tab-content">
                    <div id="genre-subscriptions-container" class="subscriptions-list"></div>
                    <div id="no-genre-subscriptions" class="no-results-placeholder" style="display: none;">
                        <i class="fas fa-tags"></i><p>Нет подписок на жанры.</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="genre-tracks-view" style="display: none;">
            <div id="genre-track-list-container" class="track-list-container"></div>
        </div>
    </main>
</div>

<div class="player">
    <div class="player-info"> <img src="images/default-cover.png" class="player-image" id="player-current-cover"> <div class="player-text"> <div class="player-title" id="player-current-title">Название трека</div> <div class="player-artist" id="player-current-artist">Исполнитель</div> </div> </div> <div class="player-controls"> <div class="player-buttons"> <button class="player-button" id="player-shuffle"><i class="fas fa-random"></i></button> <button class="player-button" id="player-prev"><i class="fas fa-step-backward"></i></button> <button class="player-button play" id="player-play-pause"><i class="fas fa-play"></i></button> <button class="player-button" id="player-next"><i class="fas fa-step-forward"></i></button> <button class="player-button" id="player-repeat"><i class="fas fa-redo"></i></button> </div> <div class="player-progress"> <span class="progress-time" id="player-current-time">0:00</span> <div class="progress-bar" id="player-progress-bar"> <div class="progress-fill" id="player-progress-fill"></div> </div> <span class="progress-time" id="player-duration">0:00</span> </div> </div> <div class="player-volume"> <i class="fas fa-volume-up volume-icon" id="player-volume-icon"></i> <div class="volume-bar" id="player-volume-bar"> <div class="volume-fill" id="player-volume-fill"></div> </div> </div>
</div>

<script>
    const API_BASE_URL = "http://localhost:8080";
    let currentUser = null;
    let currentAudio = new Audio();
    let currentTrackList = [];
    let currentTrackIndex = -1;
    let isShuffle = false;
    let repeatMode = 0;
    const playerElements = { playPauseBtn: document.getElementById('player-play-pause'), prevBtn: document.getElementById('player-prev'), nextBtn: document.getElementById('player-next'), shuffleBtn: document.getElementById('player-shuffle'), repeatBtn: document.getElementById('player-repeat'), progressBar: document.getElementById('player-progress-bar'), progressFill: document.getElementById('player-progress-fill'), currentTimeEl: document.getElementById('player-current-time'), durationEl: document.getElementById('player-duration'), volumeBar: document.getElementById('player-volume-bar'), volumeFill: document.getElementById('player-volume-fill'), volumeIcon: document.getElementById('player-volume-icon'), currentCover: document.getElementById('player-current-cover'), currentTitle: document.getElementById('player-current-title'), currentArtist: document.getElementById('player-current-artist') };
    const pageTitle = document.getElementById('page-title'), mainView = document.getElementById('main-view'), genreTracksView = document.getElementById('genre-tracks-view'), backToSubsBtn = document.getElementById('back-to-subs-btn'), tabsContainer = document.querySelector('.tabs-container'), feedContainer = document.getElementById('feed-container'), artistSubscriptionsContainer = document.getElementById('artist-subscriptions-container'), genreSubscriptionsContainer = document.getElementById('genre-subscriptions-container'), genreTrackListContainer = document.getElementById('genre-track-list-container'), noFeedMessage = document.getElementById('no-feed-message'), noArtistSubscriptions = document.getElementById('no-artist-subscriptions'), noGenreSubscriptions = document.getElementById('no-genre-subscriptions');

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            currentUser = await fetchData("/api/users/me");
            await loadInitialData();
            setupEventListeners();
            setupLayoutUI(currentUser);
            setupPlayerControls();
        } catch (error) {
            console.error("Критическая ошибка при инициализации:", error);
            if (String(error).includes("401") || String(error).includes("403")) {
                localStorage.removeItem("jwtToken");
                window.location.href = "/login.html";
            } else {
                document.body.innerHTML = `<p style="text-align: center; color: white; margin-top: 2rem;">Не удалось загрузить страницу. Пожалуйста, попробуйте снова.</p>`;
            }
        }
    });

    async function loadInitialData() {
        const [feed, artistSubs, genreSubs] = await Promise.all([
            fetchData("/api/feed/new", "Ошибка загрузки ленты"),
            fetchData("/api/artist-subscriptions/my", "Ошибка загрузки подписок на артистов"),
            fetchData("/api/genre-subscriptions/my", "Ошибка загрузки подписок на жанры"),
        ]);
        displayFeed(feed);
        displayArtistSubscriptions(artistSubs);
        displayGenreSubscriptions(genreSubs);
    }

    function setupEventListeners() {
        tabsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-button')) {
                const targetTab = e.target.dataset.tab;
                tabsContainer.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                document.querySelectorAll('#content-views .tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(targetTab).classList.add('active');
            }
        });
        backToSubsBtn.addEventListener('click', showMainView);
    }

    function setupLayoutUI(user) {
        document.getElementById('nav-user-greeting').textContent = `Привет, ${user.name}!`;
        const userMenuButton = document.getElementById('user-menu-button');
        const userDropdownContent = document.getElementById('user-dropdown-content');
        userMenuButton.addEventListener('click', (e) => { e.stopPropagation(); userMenuButton.parentElement.classList.toggle('active'); userDropdownContent.style.display = userMenuButton.parentElement.classList.contains('active') ? 'block' : 'none'; });
        window.addEventListener('click', () => { if (userMenuButton.parentElement.classList.contains('active')) { userMenuButton.parentElement.classList.remove('active'); userDropdownContent.style.display = 'none'; } });
        document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem("jwtToken"); window.location.href = "/login.html"; });
        renderSidebar();
        highlightActiveSidebarLink();
    }

    function renderSidebar() {
        document.getElementById('main-sidebar').innerHTML = `
            <div class="sidebar-section"><ul class="sidebar-menu"><li><a href="main.html"><i class="fas fa-home"></i> <span>Главная</span></a></li></ul></div>
            <div class="sidebar-section">
                <h3 class="sidebar-title">Моя медиатека</h3>
                <ul class="sidebar-menu">
                    <li><a href="my-playlists.html"><i class="fas fa-list"></i> <span>Мои плейлисты</span></a></li>
                    <li><a href="liked-tracks.html"><i class="fas fa-heart"></i> <span>Понравившиеся</span></a></li>
                    <li><a href="subscriptions.html"><i class="fas fa-rss"></i> <span>Лента и подписки</span></a></li>
                </ul>
            </div>
            ${currentUser.role === 'ARTIST' ? `<div class="sidebar-section"><h3 class="sidebar-title">Артисту</h3><ul class="sidebar-menu"><li><a href="my-tracks-artist.html"><i class="fas fa-music"></i> <span>Мои треки</span></a></li><li><a href="my-albums-artist.html"><i class="fas fa-compact-disc"></i> <span>Мои альбомы</span></a></li><li><a href="artist-stats.html"><i class="fas fa-chart-line"></i> <span>Статистика</span></a></li></ul></div>` : ''}`;
    }

    function highlightActiveSidebarLink() {
        const currentPageFile = window.location.pathname.split('/').pop() || 'subscriptions.html';
        document.querySelectorAll('.sidebar-menu a').forEach(link => { if (link.getAttribute('href') === currentPageFile) { link.classList.add('active-sidebar-link'); } });
    }

    function showMainView() {
        mainView.style.display = 'block';
        genreTracksView.style.display = 'none';
        pageTitle.textContent = 'Лента и подписки';
        backToSubsBtn.style.display = 'none';
    }

    async function showTracksForGenre(genre) {
        mainView.style.display = 'none';
        genreTracksView.style.display = 'block';
        pageTitle.textContent = `Треки в жанре: ${genre}`;
        backToSubsBtn.style.display = 'inline-flex';
        genreTrackListContainer.innerHTML = `<p>Загрузка...</p>`;
        try {
            const tracks = await fetchData(`/api/tracks/genre/${genre}`);
            currentTrackList = tracks;
            genreTrackListContainer.innerHTML = '';
            if (!tracks || tracks.length === 0) { genreTrackListContainer.innerHTML = `<div class="no-results-placeholder"><i class="fas fa-compact-disc"></i><p>В этом жанре пока нет треков.</p></div>`; }
            else {
                tracks.forEach(track => genreTrackListContainer.insertAdjacentHTML('beforeend', createTrackCardHTML(track)));
                rebindEventListenersForContainer(genreTrackListContainer);
            }
        } catch (error) { genreTrackListContainer.innerHTML = `<div class="no-results-placeholder"><i class="fas fa-exclamation-triangle"></i><p>Ошибка загрузки треков: ${error.message}</p></div>`; }
    }

    function displayFeed(feedItems) {
        feedContainer.innerHTML = '';
        noFeedMessage.style.display = (!feedItems || feedItems.length === 0) ? 'block' : 'none';
        if (!feedItems) return;
        currentTrackList = feedItems.filter(item => item.track).map(item => item.track);
        feedItems.forEach(item => {
            const releaseDate = new Date(item.releaseDate).toLocaleDateString();
            let contentHTML = '';
            if (item.track) {
                contentHTML = `<div class="feed-item-header"><i class="fas fa-music"></i> Новый трек от <strong>${item.track.artist.name}</strong> · ${releaseDate}</div>${createTrackCardHTML(item.track)}`;
            } else if (item.album) {
                contentHTML = `<div class="feed-item-header"><i class="fas fa-compact-disc"></i> Новый альбом от <strong>${item.album.artistName}</strong> · ${releaseDate}</div><a href="album-detail.html?id=${item.album.id}">${createAlbumCardHTML(item.album)}</a>`;
            }
            feedContainer.insertAdjacentHTML('beforeend', `<div class="feed-item" data-notification-id="${item.id}">${contentHTML}</div>`);
        });
        rebindEventListenersForContainer(feedContainer);
    }

    function displayArtistSubscriptions(subs) {
        artistSubscriptionsContainer.innerHTML = '';
        noArtistSubscriptions.style.display = (!subs || subs.length === 0) ? 'block' : 'none';
        if(!subs) return;
        subs.forEach(sub => artistSubscriptionsContainer.insertAdjacentHTML('beforeend', createSubscriptionCardHTML(sub.artistId, sub.artistName, 'artist')));
        artistSubscriptionsContainer.querySelectorAll('.unsubscribe-button').forEach(btn => btn.addEventListener('click', handleUnsubscribeArtist));
    }

    function displayGenreSubscriptions(subs) {
        genreSubscriptionsContainer.innerHTML = '';
        noGenreSubscriptions.style.display = (!subs || subs.length === 0) ? 'block' : 'none';
        if(!subs) return;
        subs.forEach(sub => {
            const card = document.createElement('div');
            card.innerHTML = createSubscriptionCardHTML(null, sub.genre, 'genre');
            const subCard = card.firstElementChild;
            subCard.dataset.genreName = sub.genre;
            subCard.querySelector('.details').addEventListener('click', () => showTracksForGenre(sub.genre));
            subCard.querySelector('.unsubscribe-button').addEventListener('click', (e) => { e.stopPropagation(); handleUnsubscribeGenre(e); });
            genreSubscriptionsContainer.appendChild(subCard);
        });
    }

    function createSubscriptionCardHTML(id, name, type) { return `<div class="subscription-card" data-artist-id="${id || ''}"><div class="details">${type === 'artist' ? `<a href="artist.html?id=${id}" class="name">${name}</a>` : `<div class="name">${name}</div>`}</div><button class="unsubscribe-button">Отписаться</button></div>`; }
    function createTrackCardHTML(track) { return `<div class="track-card" data-track-id="${track.id}"><div class="track-cover" style="background-image: url('${API_BASE_URL}${track.coverPath || '/images/default-cover.png'}')"></div><div class="track-details-wrapper"><div class="track-info-primary"><h3>${track.title}</h3><p class="artist-name"><a href="artist.html?id=${track.artist.id}">${track.artist.name}</a></p></div><div class="track-stats-info"><span><i class="fas fa-headphones"></i> ${track.listensCount || 0}</span><span><i class="fas fa-heart"></i> ${track.likesCount || 0}</span></div></div><div class="track-actions-group"><button class="play-button"><i class="fas fa-play"></i> Play</button></div></div>`; }
    function createAlbumCardHTML(album) { const coverUrl = (album.tracks && album.tracks.length > 0 && album.tracks[0].coverPath) ? `${API_BASE_URL}${album.tracks[0].coverPath}` : 'images/default-cover.png'; return `<div class="track-card"><img src="${coverUrl}" style="width:50px; height:50px; border-radius:6px; margin-right:1rem;"><div><h3>${album.name}</h3><p>${album.artistName}</p></div></div>`; }

    function rebindEventListenersForContainer(container) {
        container.querySelectorAll('.play-button').forEach(btn => {
            const feedItem = btn.closest('.feed-item');
            const card = btn.closest('.track-card');
            const trackId = Number(card.dataset.trackId);
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (feedItem) markNotificationAsSeen(feedItem.dataset.notificationId);
                const list = (container === genreTrackListContainer) ? currentTrackList : currentTrackList.filter(t => t.id === trackId);
                const trackIndex = list.findIndex(t => t.id === trackId);
                if (trackIndex !== -1) playTrackFromList(trackIndex, list);
            });
        });
        container.querySelectorAll('.feed-item a').forEach(link => {
            const feedItem = link.closest('.feed-item');
            link.addEventListener('click', () => { if(feedItem) markNotificationAsSeen(feedItem.dataset.notificationId); });
        });
    }

    async function handleUnsubscribeArtist(event) {
        const card = event.target.closest('.subscription-card');
        if (confirm(`Отписаться от ${card.querySelector('.name').textContent}?`)) {
            await fetchData(`/api/artist-subscriptions?artistId=${card.dataset.artistId}`, 'Ошибка', { method: 'DELETE' });
            card.remove();
        }
    }

    async function handleUnsubscribeGenre(event) {
        const card = event.target.closest('.subscription-card');
        if (confirm(`Отписаться от жанра "${card.dataset.genreName}"?`)) {
            await fetchData(`/api/genre-subscriptions?genre=${encodeURIComponent(card.dataset.genreName)}`, 'Ошибка', { method: 'DELETE' });
            card.remove();
        }
    }

    async function markNotificationAsSeen(notificationId) {
        if (!notificationId) return;
        try {
            await fetchData(`/api/feed/mark-as-seen/${notificationId}`, "Ошибка", { method: 'POST' });
            console.log(`Notification ${notificationId} marked as seen.`);
        } catch (error) {
            console.error("Не удалось отметить уведомление как просмотренное:", error);
        }
    }

    async function fetchData(endpoint, errorMessage = "Ошибка", options = {}) {
        const token = localStorage.getItem("jwtToken");
        if (!token && !options.isPublic) throw new Error("401");
        options.headers = { ...options.headers, 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        try {
            const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
            if (!response.ok) throw new Error(`${response.status}`);
            return response.status === 204 ? null : response.json();
        } catch (error) { console.error(`Ошибка при запросе к ${endpoint}:`, error); throw error; }
    }

    function setupPlayerControls() {
        playerElements.playPauseBtn.addEventListener('click', togglePlayPause);
        playerElements.nextBtn.addEventListener('click', playNextTrack);
        playerElements.prevBtn.addEventListener('click', playPrevTrack);
        playerElements.shuffleBtn.addEventListener('click', toggleShuffle);
        playerElements.repeatBtn.addEventListener('click', cycleRepeatMode);
        currentAudio.addEventListener('timeupdate', () => { const { currentTime, duration } = currentAudio; if (isNaN(duration)) return; playerElements.currentTimeEl.textContent = formatTime(currentTime); playerElements.progressFill.style.width = `${(currentTime / duration) * 100}%`; });
        currentAudio.addEventListener('loadedmetadata', () => playerElements.durationEl.textContent = formatTime(currentAudio.duration));
        currentAudio.addEventListener('ended', handleTrackEnd);
        currentAudio.addEventListener('play', () => playerElements.playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>');
        currentAudio.addEventListener('pause', () => playerElements.playPauseBtn.innerHTML = '<i class="fas fa-play"></i>');
        playerElements.progressBar.addEventListener('click', e => { if (isNaN(currentAudio.duration)) return; const rect = playerElements.progressBar.getBoundingClientRect(); currentAudio.currentTime = ((e.clientX - rect.left) / rect.width) * currentAudio.duration; });
        playerElements.volumeBar.addEventListener('click', e => { const rect = playerElements.volumeBar.getBoundingClientRect(); const vol = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)); currentAudio.volume = vol; playerElements.volumeFill.style.width = `${vol*100}%`; updateVolumeIcon(vol); });
    }
    function playTrackFromList(index, trackList) {
        if (!trackList || trackList.length === 0) return;
        currentTrackList = trackList;
        currentTrackIndex = index;
        const track = currentTrackList[currentTrackIndex];
        currentAudio.src = `${API_BASE_URL}${track.filePath}`;
        currentAudio.play();
        updatePlayerUI(track);
        fetch(`${API_BASE_URL}/api/tracks/${track.id}/listen`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${localStorage.getItem("jwtToken")}` } });
    }
    function updatePlayerUI(track) {
        playerElements.currentCover.src = `${API_BASE_URL}${track.coverPath || '/images/default-cover.png'}`;
        playerElements.currentTitle.textContent = track.title;
        playerElements.currentArtist.textContent = track.artist.name;
    }
    function togglePlayPause() { if (!currentAudio.src) { if (currentTrackList.length > 0) playTrackFromList(0, currentTrackList); } else { currentAudio.paused ? currentAudio.play() : currentAudio.pause(); } }
    function playNextTrack() { if (currentTrackList.length === 0) return; currentTrackIndex = isShuffle ? Math.floor(Math.random() * currentTrackList.length) : (currentTrackIndex + 1) % currentTrackList.length; playTrackFromList(currentTrackIndex, currentTrackList); }
    function playPrevTrack() { if (currentTrackList.length === 0) return; if (currentAudio.currentTime > 3) { currentAudio.currentTime = 0; } else { currentTrackIndex = (currentTrackIndex - 1 + currentTrackList.length) % currentTrackList.length; playTrackFromList(currentTrackIndex, currentTrackList); } }
    function handleTrackEnd() { if (repeatMode === 2) { currentAudio.currentTime = 0; currentAudio.play(); } else if (repeatMode === 1) { playNextTrack(); } else { if (currentTrackIndex < currentTrackList.length - 1 || isShuffle) playNextTrack(); } }
    function toggleShuffle() { isShuffle = !isShuffle; playerElements.shuffleBtn.classList.toggle('active-control', isShuffle); }
    function cycleRepeatMode() { repeatMode = (repeatMode + 1) % 3; const icons = ['fa-redo', 'fa-redo-alt', 'fa-random']; playerElements.repeatBtn.querySelector('i').className = `fas ${icons[repeatMode]}`; playerElements.repeatBtn.classList.toggle('active-control', repeatMode !== 0); }
    function formatTime(s) { return isNaN(s) ? "0:00" : `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }
    function updateVolumeIcon(vol) { if (!playerElements.volumeIcon) return; playerElements.volumeIcon.className = vol === 0 ? 'fas fa-volume-mute volume-icon' : (vol < 0.5 ? 'fas fa-volume-down volume-icon' : 'fas fa-volume-up volume-icon'); }
</script>
</body>
</html>
