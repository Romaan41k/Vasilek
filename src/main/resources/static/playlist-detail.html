<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали плейлиста - Василёк</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #5A87D0;
            --secondary-color: #9d79d0;
            --tertiary-color: #64b58e;
            --background-color: #121212;
            --surface-color: #1a1a1a;
            --surface-highlight-color: #242424;
            --text-color: #ffffff;
            --text-muted-color: #b3b3b3;
            --text-artist-color: #e0e0e0;
            --border-color: #2f2f2f;
            --sidebar-width: 260px;
            --player-height: 90px;
            --navbar-height: 85px;
            --content-padding: 1.5rem;
        }

        html { box-sizing: border-box; }
        *, *::before, *::after { box-sizing: inherit; }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: var(--navbar-height);
            padding-bottom: var(--player-height);
        }

        .navbar { position: fixed; top: 0; left: 0; right: 0; height: var(--navbar-height); background-color: rgba(20, 20, 20, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 var(--content-padding); z-index: 1000; border-bottom: 1px solid var(--primary-color); backdrop-filter: blur(5px); }
        .navbar-logo a { display: flex; align-items: center; }
        .navbar-logo img { height: 70px; width: auto; }
        .navbar-links { display: flex; align-items: center; gap: 1rem; }
        .user-dropdown { position: relative; display: inline-block; }
        #user-menu-button { background: none; border: none; color: var(--text-muted-color); cursor: pointer; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 20px; transition: background-color 0.2s, color 0.2s; }
        #user-menu-button:hover, .user-dropdown.active #user-menu-button { background-color: var(--surface-color); color: var(--text-color); }
        .dropdown-arrow { font-size: 0.8em; transition: transform 0.2s ease-in-out; }
        .user-dropdown.active .dropdown-arrow { transform: rotate(180deg); }
        .dropdown-content { display: none; position: absolute; background-color: var(--surface-color); min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4); z-index: 1; border-radius: 8px; padding: 0.5rem 0; right: 0; top: 120%; border: 1px solid var(--border-color); }
        .dropdown-content a { color: var(--text-artist-color); padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; }
        .dropdown-content a:hover { background-color: var(--surface-highlight-color); color: var(--primary-color); }

        .main-layout-container { display: flex; width: 100%; flex-grow: 1; }
        .sidebar { width: var(--sidebar-width); background-color: var(--surface-color); padding: 1.5rem 0; height: calc(100vh - 70px - var(--player-height)); overflow-y: auto; position: fixed; top: 70px; left: 0; border-right: 1px solid var(--border-color); }
        .sidebar-section { margin-bottom: 1.5rem; }
        .sidebar-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted-color); padding: 0 1.5rem; margin-bottom: 0.75rem; font-weight: bold; letter-spacing: 0.5px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 0.75rem 1.5rem; color: var(--text-artist-color); text-decoration: none; font-size: 0.95rem; transition: background-color 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active-sidebar-link { background-color: var(--surface-highlight-color); color: var(--primary-color); font-weight: bold; border-left-color: var(--primary-color); }
        .sidebar-menu li a i { margin-right: 1rem; width: 20px; text-align: center; color: var(--text-muted-color); }
        .sidebar-menu li a:hover i, .sidebar-menu li a.active-sidebar-link i { color: var(--primary-color); }

        .content { flex-grow: 1; padding: 2rem; margin-left: var(--sidebar-width); overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 1rem; min-height: 42px; }
        .page-header .playlist-title-container { flex-grow: 1; display: flex; align-items: center; }
        .page-header h1.playlist-title-display { color: var(--primary-color); font-size: 2rem; margin: 0; cursor: pointer; transition: opacity 0.2s; }
        .page-header h1.playlist-title-display:hover { opacity: 0.8; }
        .page-header input.playlist-title-input { font-size: 2rem; font-family: inherit; font-weight: bold; background: none; border: none; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding: 0.2rem 0.5rem; margin: 0; outline: none; display: none; width: 70%; }
        .page-header .edit-actions { display: none; gap: 0.5rem; margin-left: 1rem; }
        .page-header .edit-actions button { padding: 0.5rem 1rem; font-size: 0.9rem; border-radius: 5px; cursor: pointer; border: none; }
        .save-playlist-btn { background-color: var(--tertiary-color); color: white; }
        .cancel-edit-playlist-btn { background-color: #6c757d; color: white; }
        .back-to-list-button { background-color: var(--surface-highlight-color); color: var(--text-muted-color); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
        .back-to-list-button:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .back-to-list-button i { margin-right: 0.3rem; }

        .track-list-container { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
        .track-card {
            background-color: var(--surface-color); border-radius: 8px;
            padding: 0.75rem 1rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: background-color 0.2s, border-color 0.2s, padding-left 0.2s;
            border: 1px solid var(--border-color); display: flex;
            align-items: center; width: 100%; min-height: 80px;
        }
        .track-card:hover { background-color: var(--surface-highlight-color); border-left: 3px solid var(--primary-color); padding-left: calc(1rem - 3px); }
        .track-cover { width: 50px; height: 50px; min-width: 50px; flex-shrink: 0; background-size: cover; background-position: center; border-radius: 6px; background-color: #222; margin-right: 1rem; }
        .track-details-wrapper { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; margin-right: 1rem; }
        .track-info-primary h3 { margin: 0 0 0.1rem 0; font-size: 1rem; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info-primary p.artist-name { margin: 0; font-size: 0.85rem; color: var(--text-artist-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-stats-info { display: flex; align-items: center; font-size: 0.75rem; color: var(--text-muted-color); gap: 0.75rem; margin-top: 0.3rem; }
        .track-stats-info .stats-item i { margin-right: 3px; }

        .track-actions-group { display: flex; align-items: center; flex-shrink: 0; margin-left: auto; }
        .track-actions-group .play-button { background-color: var(--primary-color); color: white; border: none; padding: 0.6rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: background-color 0.3s; display: inline-flex; align-items: center; margin-right: 0.75rem; }
        .track-actions-group .play-button:hover { background-color: #4a77c0; }
        .track-actions-group .play-button i { margin-right: 5px; }

        .track-meta-actions-buttons { display: flex; align-items: center; gap: 0.5rem; }
        .track-actions-group .icon-button {
            background: none; border: none; color: var(--text-muted-color);
            font-size: 1.1rem; cursor: pointer; padding: 0.4rem; border-radius: 50%;
            transition: color 0.2s, background-color 0.2s, transform 0.2s;
            display: inline-flex; align-items: center; justify-content: center; line-height: 1;
        }
        .track-actions-group .icon-button:hover { color: var(--primary-color); background-color: rgba(90, 135, 208, 0.1); transform: scale(1.1); }
        .track-actions-group .icon-button.liked { color: var(--primary-color); }
        .track-actions-group a.icon-button { text-decoration: none; }

        .player {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height);
            background-color: #1c1c1c; border-top: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; z-index: 1000;
        }
        .player-info { display: flex; align-items: center; min-width: 200px; flex-shrink: 0; }
        .player-image { width: 50px; height: 50px; border-radius: 4px; margin-right: 1rem; object-fit: cover; background-color: #333; }
        .player-text { display: flex; flex-direction: column; overflow: hidden;}
        .player-title { font-size: 0.9rem; font-weight: 500; color: var(--text-color); margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-artist { font-size: 0.8rem; color: var(--text-muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-controls { display: flex; flex-direction: column; align-items: center; flex-grow: 1; margin: 0 1rem; min-width: 250px; max-width: 600px; }
        .player-buttons { display: flex; align-items: center; margin-bottom: 0.5rem; }
        .player-button { background: none; border: none; color: var(--text-muted-color); font-size: 1.1rem; cursor: pointer; padding: 0.5rem; transition: color 0.2s; }
        .player-button:hover { color: var(--text-color); }
        .player-button.play { font-size: 1.5rem; color: var(--text-color); }
        .player-button.play:hover { color: var(--primary-color); }
        .player-button.active-control { color: var(--primary-color); }
        .player-progress { display: flex; align-items: center; width: 100%; }
        .progress-time { font-size: 0.75rem; color: var(--text-muted-color); margin: 0 0.5rem; }
        .progress-bar { flex-grow: 1; height: 4px; background-color: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; width: 0%; background-color: var(--primary-color); border-radius: 2px; }
        .player-volume { display: flex; align-items: center; min-width: 120px; justify-content: flex-end; flex-shrink: 0;}
        .volume-icon { color: var(--text-muted-color); margin-right: 0.75rem; font-size: 1rem; }
        .volume-bar { width: 80px; height: 4px; background-color: #404040; border-radius: 2px; cursor: pointer; position: relative; }
        .volume-fill { height: 100%; width: 70%; background-color: var(--text-color); border-radius: 2px; }

        .message-area { margin-bottom: 1rem; }
        .message { padding: .75rem; border-radius: 6px; font-size: .9rem; display: none; text-align: center; border: 1px solid; }
        .success { background-color: rgba(100, 181, 142, 0.2); color: var(--tertiary-color); border-color: var(--tertiary-color); }
        .error { background-color: rgba(90, 135, 208, 0.2); color: var(--primary-color); border-color: var(--primary-color); }
        .no-tracks-placeholder { text-align: center; color: #777; padding: 3rem; border: 2px dashed #333; border-radius: 8px; margin-top: 2rem; }
        .no-tracks-placeholder i { font-size: 3rem; margin-bottom: 1rem; display: block; }
    </style>
</head>
<body>

<nav class="navbar">

    <div class="navbar-links">

            <div id="user-dropdown-content" class="dropdown-content">

<div class="main-layout-container">
    <aside class="sidebar">

                <li><a href="liked-tracks.html"><i class="fas fa-heart"></i> <span>Понравившиеся</span></a></li>

    <main class="content">

                <h1 id="playlist-title-display" class="playlist-title-display" title="Нажмите для редактирования">Загрузка...</h1>

        <!-- ИЗМЕНЕНИЕ: Используем тот же контейнер, что и на главной -->

<div class="player">
    <div class="player-info"> <img src="images/default-cover.png" alt="Track cover" class="player-image" id="player-current-cover"> <div class="player-text"> <div class="player-title" id="player-current-title">Название трека</div> <div class="player-artist" id="player-current-artist">Исполнитель</div> </div> </div> <div class="player-controls"> <div class="player-buttons"> <button class="player-button" id="player-shuffle" title="Перемешать"><i class="fas fa-random"></i></button> <button class="player-button" id="player-prev" title="Предыдущий трек"><i class="fas fa-step-backward"></i></button> <button class="player-button play" id="player-play-pause" title="Воспроизвести/Пауза"><i class="fas fa-play"></i></button> <button class="player-button" id="player-next" title="Следующий трек"><i class="fas fa-step-forward"></i></button> <button class="player-button" id="player-repeat" title="Повтор выключен"><i class="fas fa-redo"></i></button> </div> <div class="player-progress"> <span class="progress-time" id="player-current-time">0:00</span> <div class="progress-bar" id="player-progress-bar"> <div class="progress-fill" id="player-progress-fill"></div> </div> <span class="progress-time" id="player-duration">0:00</span> </div> </div> <div class="player-volume"> <i class="fas fa-volume-up volume-icon" id="player-volume-icon"></i> <div class="volume-bar" id="player-volume-bar"> <div class="volume-fill" id="player-volume-fill"></div> </div> </div>
</div>

<script>
    let currentUser = null;
    const API_BASE_URL = "http://localhost:8080";
    let currentAudio = new Audio();
    let currentPlaylistData = null;
    let currentTrackList = [];
    let currentTrackIndex = -1;
    let isShuffle = false;
    let repeatMode = 0;
    let playlistId = null;

    document.addEventListener('DOMContentLoaded', async function() {
        const token = localStorage.getItem("jwtToken");
        if (!token) { window.location.href = "/login.html"; return; }
        const urlParams = new URLSearchParams(window.location.search);
        playlistId = urlParams.get('id');
        if (!playlistId) { displayGeneralMessage("ID плейлиста не найден в URL.", 'error'); return; }

        try {
            const response = await fetch(`${API_BASE_URL}/api/users/me`, { headers: { "Authorization": `Bearer ${token}` } });
            if (!response.ok) { localStorage.removeItem("jwtToken"); window.location.href = "/login.html"; return; }
            currentUser = await response.json();

            setupLayoutUI(currentUser);
            await loadPlaylistDetails();
            setupPlayerControls();
            setupEditPlaylistTitleControls();
        } catch (error) {
            console.error("Ошибка инициализации:", error.message);
            displayGeneralMessage("Не удалось загрузить детали плейлиста. " + error.message, 'error');
        }
    });

    function setupLayoutUI(user) {
        const userGreeting = document.getElementById('nav-user-greeting');
        if (userGreeting) userGreeting.textContent = `Привет, ${user.name}!`;
        setupDropdownMenu();
        const artistSection = document.getElementById('artist-section-sidebar');
        if (artistSection) artistSection.style.display = (user.role === 'ARTIST') ? 'block' : 'none';
        highlightActiveSidebarLink();
    }

    function setupDropdownMenu() {
        const userMenuButton = document.getElementById('user-menu-button');
        const userDropdownContent = document.getElementById('user-dropdown-content');
        const logoutLink = document.getElementById('logout-link');
        if (userMenuButton) {
            userMenuButton.addEventListener('click', function(event) {
                event.stopPropagation();
                this.parentElement.classList.toggle('active');
                userDropdownContent.style.display = this.parentElement.classList.contains('active') ? 'block' : 'none';
            });
        }
        window.addEventListener('click', function(event) {
            if (userMenuButton && !userMenuButton.contains(event.target) && userMenuButton.parentElement.classList.contains('active')) {
                userMenuButton.parentElement.classList.remove('active');
                if(userDropdownContent) userDropdownContent.style.display = 'none';
            }
        });
        if (logoutLink) {
            logoutLink.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem("jwtToken");
                window.location.href = "/login.html";
            });
        }
    }

    function highlightActiveSidebarLink() {
        const sidebarLinks = document.querySelectorAll('.sidebar-menu a');
        sidebarLinks.forEach(link => {
            const linkFile = link.getAttribute('href');
            if (linkFile === 'my-playlists.html') {
                link.classList.add('active-sidebar-link');
            } else {
                link.classList.remove('active-sidebar-link');
            }
        });
    }

    async function fetchData(endpoint, errorMessagePrefix = "Ошибка", options = {}) {
        const token = localStorage.getItem("jwtToken");
        if (!options.isPublic && !token) { window.location.href = "/login.html"; throw new Error("No token available"); }
        const fetchOptions = { ...options, headers: { ...(options.headers || {}) } };
        if (token && !options.isPublic) fetchOptions.headers['Authorization'] = `Bearer ${token}`;
        if (options.body && typeof options.body === 'string' && !fetchOptions.headers['Content-Type']) fetchOptions.headers['Content-Type'] = 'application/json';
        try {
            const response = await fetch(`${API_BASE_URL}${endpoint}`, fetchOptions);
            if (!options.isPublic && (response.status === 401 || response.status === 403)) { localStorage.removeItem("jwtToken"); window.location.href = "/login.html"; throw new Error(`Auth error: ${response.status}`); }
            if (response.status === 204) return { success: true, noBody: true };
            if (!response.ok) {
                const errorText = await response.text(); let errorData;
                try { errorData = JSON.parse(errorText); } catch (e) { errorData = { message: errorText || `Ошибка сервера: ${response.status}` };}
                throw new Error(errorData.data?.message || errorData.message || `${errorMessagePrefix}: ${response.status}`);
            }
            if (response.headers.get("content-length") === "0" && response.status !== 204) return [];
            return await response.json();
        } catch (error) {
            console.error(`fetchData (${endpoint}) error:`, error.message);
            if (!error.message.startsWith("Auth error") && !error.message.startsWith("No token")) displayGeneralMessage(error.message, 'error');
            throw error;
        }
    }

    function displayGeneralMessage(message, type = 'success') {
        const messageArea = document.getElementById('message-area');
        if (messageArea) {
            messageArea.innerHTML = `<div class="message ${type}" style="display:block;">${message}</div>`;
            setTimeout(() => { messageArea.innerHTML = ''; }, 5000);
        }
    }

    async function loadPlaylistDetails() {
        const playlistTitleDisplay = document.getElementById('playlist-title-display');
        const trackListContainer = document.getElementById('track-list-container');
        const noTracksMessage = document.getElementById('no-tracks-in-playlist-message');
        playlistTitleDisplay.textContent = 'Загрузка...';
        trackListContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted-color);">Загрузка треков...</p>';
        noTracksMessage.style.display = 'none';
        try {
            currentPlaylistData = await fetchData(`/api/playlists/${playlistId}`, "Ошибка загрузки деталей плейлиста");
            if (!currentPlaylistData || typeof currentPlaylistData.name === 'undefined') {
                throw new Error("Некорректные данные плейлиста получены с сервера.");
            }
            playlistTitleDisplay.textContent = currentPlaylistData.name;
            document.title = `${currentPlaylistData.name} - Василёк`;
            currentTrackList = currentPlaylistData.tracks || [];
            displayPlaylistTracks(currentTrackList);
        } catch (error) {
            playlistTitleDisplay.textContent = 'Ошибка загрузки';
        }
    }

    function displayPlaylistTracks(tracks) {
        const trackListContainer = document.getElementById('track-list-container');
        const noTracksMessage = document.getElementById('no-tracks-in-playlist-message');
        trackListContainer.innerHTML = '';
        if (!tracks || tracks.length === 0) {
            noTracksMessage.style.display = 'block';
            return;
        }
        noTracksMessage.style.display = 'none';

        tracks.forEach((track, index) => {
            const coverUrl = track.coverPath ? `${API_BASE_URL}${track.coverPath}` : 'images/default-cover.png';
            const trackCardHTML = `
                <div class="track-card" data-track-id="${track.id}" data-track-index="${index}">
                    <div class="track-cover" style="background-image: url('${coverUrl}')"></div>
                    <div class="track-details-wrapper">
                        <div class="track-info-primary">
                            <h3 title="${track.title}">${track.title || 'Без названия'}</h3>
                            <p class="artist-name">${track.artist?.name || 'Неизвестный'}</p>
                        </div>
                        <div class="track-stats-info">
                            <span class="stats-item"><i class="fas fa-headphones"></i> ${track.listensCount || 0}</span>
                            <span class="stats-item"><i class="fas fa-heart"></i> ${track.likesCount || 0}</span>
                        </div>
                    </div>
                    <div class="track-actions-group">
                        <button class="play-button" data-track-index="${index}"><i class="fas fa-play"></i> Play</button>
                        <div class="track-meta-actions-buttons">
                            ${currentUser && currentPlaylistData && currentPlaylistData.userId === currentUser.id ?
                `<button class="icon-button remove-track-btn" title="Удалить из плейлиста"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                    </div>
                </div>
            `;
            trackListContainer.insertAdjacentHTML('beforeend', trackCardHTML);
        });

        trackListContainer.querySelectorAll('.play-button').forEach(button => {
            button.addEventListener('click', function() {
                playTrackFromList(parseInt(this.closest('.track-card').dataset.trackIndex));
            });
        });

        if (currentUser && currentPlaylistData && currentPlaylistData.userId === currentUser.id) {
            trackListContainer.querySelectorAll('.remove-track-btn').forEach(button => {
                button.addEventListener('click', handleRemoveTrackFromPlaylist);
            });
        }
    }

    function setupEditPlaylistTitleControls() {
        const titleDisplay = document.getElementById('playlist-title-display');
        const titleInput = document.getElementById('playlist-title-input');
        const editActions = document.getElementById('edit-actions-buttons');
        const saveBtn = document.getElementById('save-playlist-btn');
        const cancelBtn = document.getElementById('cancel-edit-playlist-btn');
        if (!titleDisplay || !titleInput || !editActions || !saveBtn || !cancelBtn) return;
        titleDisplay.addEventListener('click', () => {
            if (currentPlaylistData && currentUser && currentPlaylistData.userId === currentUser.id) {
                titleDisplay.style.display = 'none';
                titleInput.value = titleDisplay.textContent;
                titleInput.style.display = 'inline-block';
                editActions.style.display = 'inline-flex';
                titleInput.focus();
            }
        });
        const endEditing = () => {
            titleInput.style.display = 'none';
            editActions.style.display = 'none';
            titleDisplay.style.display = 'inline-block';
        };
        saveBtn.addEventListener('click', async () => {
            const newName = titleInput.value.trim();
            if (newName && newName !== currentPlaylistData.name) {
                try {
                    const updatedPlaylist = await fetchData(`/api/playlists/${playlistId}`, "Ошибка", {
                        method: 'PUT', body: JSON.stringify({ name: newName })
                    });
                    currentPlaylistData.name = updatedPlaylist.name || newName;
                    titleDisplay.textContent = currentPlaylistData.name;
                    displayGeneralMessage("Название плейлиста обновлено.", 'success');
                } catch (error) {
                    titleInput.value = currentPlaylistData.name;
                }
            }
            endEditing();
        });
        cancelBtn.addEventListener('click', endEditing);
        titleInput.addEventListener('keypress', e => { if (e.key === 'Enter') saveBtn.click(); });
    }

    async function handleRemoveTrackFromPlaylist(event) {
        const trackItem = event.currentTarget.closest('.track-card');
        const trackIdToRemove = trackItem.dataset.trackId;
        const trackTitle = trackItem.querySelector('h3').textContent;
        if (!playlistId || !trackIdToRemove) return;
        if (confirm(`Удалить трек "${trackTitle}" из этого плейлиста?`)) {
            try {
                await fetchData(`/api/playlists/${playlistId}/remove-track/${trackIdToRemove}`, "Ошибка", { method: 'PUT' });
                trackItem.remove();
                currentPlaylistData.tracks = currentPlaylistData.tracks.filter(t => t.id != trackIdToRemove);
                currentTrackList = currentPlaylistData.tracks;
                document.querySelectorAll('.track-card').forEach((item, i) => item.dataset.trackIndex = i);
                if (currentTrackList.length === 0) document.getElementById('no-tracks-in-playlist-message').style.display = 'block';
                displayGeneralMessage(`Трек "${trackTitle}" удален.`, 'success');
                if (currentAudio.src && currentTrackIndex !== -1 && currentTrackList[currentTrackIndex]?.id == trackIdToRemove) {
                    if (currentTrackList.length > 0) playTrackFromList(0);
                    else { currentAudio.pause(); currentAudio.src = ""; updatePlayerUI(null); }
                }
            } catch (error) { }
        }
    }

    const playerElements = { playPauseBtn: document.getElementById('player-play-pause'), prevBtn: document.getElementById('player-prev'), nextBtn: document.getElementById('player-next'), shuffleBtn: document.getElementById('player-shuffle'), repeatBtn: document.getElementById('player-repeat'), progressBar: document.getElementById('player-progress-bar'), progressFill: document.getElementById('player-progress-fill'), currentTimeEl: document.getElementById('player-current-time'), durationEl: document.getElementById('player-duration'), volumeBar: document.getElementById('player-volume-bar'), volumeFill: document.getElementById('player-volume-fill'), volumeIcon: document.getElementById('player-volume-icon'), currentCover: document.getElementById('player-current-cover'), currentTitle: document.getElementById('player-current-title'), currentArtist: document.getElementById('player-current-artist') };
    function setupPlayerControls() { if (!playerElements.playPauseBtn) return; playerElements.playPauseBtn.addEventListener('click', togglePlayPause); playerElements.nextBtn.addEventListener('click', playNextTrack); playerElements.prevBtn.addEventListener('click', playPrevTrack); playerElements.shuffleBtn.addEventListener('click', toggleShuffle); playerElements.repeatBtn.addEventListener('click', cycleRepeatMode); currentAudio.addEventListener('loadedmetadata', updatePlayerDuration); currentAudio.addEventListener('timeupdate', updatePlayerProgress); currentAudio.addEventListener('ended', handleTrackEnd); currentAudio.addEventListener('play', () => playerElements.playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>'); currentAudio.addEventListener('pause', () => playerElements.playPauseBtn.innerHTML = '<i class="fas fa-play"></i>'); playerElements.progressBar.addEventListener('click', seekTrack); playerElements.volumeBar.addEventListener('click', setVolume); currentAudio.volume = 0.7; playerElements.volumeFill.style.width = (currentAudio.volume * 100) + '%'; updateVolumeIcon(currentAudio.volume); }
    function playTrackFromList(index) { if (index < 0 || index >= currentTrackList.length) return; currentTrackIndex = index; const track = currentTrackList[currentTrackIndex]; if (!track || !track.filePath || !track.artist || !track.artist.name) return; const token = localStorage.getItem("jwtToken"); fetch(`${API_BASE_URL}/api/tracks/${track.id}/listen`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } }).catch(console.error); currentAudio.src = `${API_BASE_URL}${track.filePath}`; currentAudio.play().catch(console.error); updatePlayerUI(track); }
    function updatePlayerUI(track) { if (!playerElements.currentCover) return; if (track) { playerElements.currentCover.src = track.coverPath ? `${API_BASE_URL}${track.coverPath}` : 'images/default-cover.png'; playerElements.currentTitle.textContent = track.title || 'Без названия'; playerElements.currentArtist.textContent = track.artist?.name || 'Неизвестный'; } else { playerElements.currentCover.src = 'images/default-cover.png'; playerElements.currentTitle.textContent = 'Название трека'; playerElements.currentArtist.textContent = 'Исполнитель'; } }
    function togglePlayPause() { if (!currentAudio.src && currentTrackList.length > 0) { playTrackFromList(0); return; } if (currentAudio.paused) currentAudio.play(); else currentAudio.pause(); }
    function playNextTrack() { if (currentTrackList.length === 0) return; let nextIndex = isShuffle ? Math.floor(Math.random() * currentTrackList.length) : (currentTrackIndex + 1) % currentTrackList.length; playTrackFromList(nextIndex); }
    function playPrevTrack() { if (currentTrackList.length === 0) return; if (currentAudio.currentTime > 3 || currentTrackIndex === -1) { if (currentTrackIndex !== -1) currentAudio.currentTime = 0; else if (currentTrackList.length > 0) playTrackFromList(0); } else { let prevIndex = isShuffle ? Math.floor(Math.random() * currentTrackList.length) : (currentTrackIndex - 1 + currentTrackList.length) % currentTrackList.length; playTrackFromList(prevIndex); } }
    function handleTrackEnd() { if (repeatMode === 2) { currentAudio.currentTime = 0; currentAudio.play(); } else if (repeatMode === 1) playNextTrack(); else { if (isShuffle || (currentTrackIndex !== -1 && currentTrackIndex < currentTrackList.length - 1)) playNextTrack(); else playerElements.playPauseBtn.innerHTML = '<i class="fas fa-play"></i>'; } }
    function updatePlayerDuration() { if (playerElements.durationEl && !isNaN(currentAudio.duration)) playerElements.durationEl.textContent = formatTime(currentAudio.duration); }
    function updatePlayerProgress() { if (playerElements.progressFill && playerElements.currentTimeEl && !isNaN(currentAudio.duration) && currentAudio.duration > 0) { playerElements.currentTimeEl.textContent = formatTime(currentAudio.currentTime); playerElements.progressFill.style.width = `${(currentAudio.currentTime / currentAudio.duration) * 100}%`; } }
    function formatTime(s) { return isNaN(s) ? "0:00" : `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }
    function seekTrack(e) { if (!currentAudio.src || isNaN(currentAudio.duration)) return; const r = playerElements.progressBar.getBoundingClientRect(); currentAudio.currentTime = ((e.clientX - r.left) / r.width) * currentAudio.duration; }
    function setVolume(e) { const r = playerElements.volumeBar.getBoundingClientRect(); let v = (e.clientX - r.left) / r.width; v = Math.max(0, Math.min(1, v)); currentAudio.volume = v; playerElements.volumeFill.style.width = `${v * 100}%`; updateVolumeIcon(v); }
    function updateVolumeIcon(v) { if (!playerElements.volumeIcon) return; playerElements.volumeIcon.className = v === 0 ? 'fas fa-volume-mute volume-icon' : (v < 0.5 ? 'fas fa-volume-down volume-icon' : 'fas fa-volume-up volume-icon'); }
    function toggleShuffle() { isShuffle = !isShuffle; playerElements.shuffleBtn.classList.toggle('active-control', isShuffle); }
    function cycleRepeatMode() { repeatMode = (repeatMode + 1) % 3; playerElements.repeatBtn.innerHTML = ['<i class="fas fa-redo"></i>', '<i class="fas fa-redo-alt"></i>', '<i class="fas fa-retweet"></i>'][repeatMode]; playerElements.repeatBtn.classList.toggle('active-control', repeatMode !== 0); }
</script>
</body>
</html>
