<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - Василёк</title>
    <style>
        :root {
            --primary-color: #5A87D0;
            --secondary-color: #9d79d0;
            --tertiary-color: #64b58e;
            --background-color: #121212;
            --surface-color: #1a1a1a;
            --surface-highlight-color: #242424;
            --text-color: #ffffff;
            --text-muted-color: #b3b3b3;
            --border-color: #2f2f2f;
        }

        body{font-family:'Arial',sans-serif;background-color:var(--background-color);color:var(--text-color);margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh}
        .navbar{position:fixed;top:0;left:0;right:0;background-color:rgba(26,26,26,0.9);display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;z-index:1000;border-bottom:1px solid var(--primary-color); backdrop-filter: blur(5px);}
        .navbar-logo a { display: flex; align-items: center; }
        .navbar-logo img{height:75px;width:auto}
        .navbar-links{display:flex;gap:1.5rem}
        .navbar-links a{color:var(--text-color);text-decoration:none;font-weight:500;transition:color .3s;position:relative}
        .navbar-links a:hover{color:var(--primary-color)}
        .navbar-links a::after{content:'';position:absolute;bottom:-5px;left:0;width:0;height:2px;background-color:var(--primary-color);transition:width .3s}
        .navbar-links a:hover::after{width:100%}

        .container{background-color:var(--surface-color);padding:2.5rem;border-radius:12px;text-align:center;box-shadow:0 8px 20px rgba(90, 135, 208, 0.1);width:100%;max-width:400px;border:1px solid var(--border-color);animation:pulse 8s infinite ease-in-out; margin-top: 70px;}

        h1{font-size:26px;margin-bottom:1.5rem;color:var(--text-color);position:relative;display:inline-block;padding-bottom:10px;width:100%}
        h1::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:300px;height:3px;background-color:var(--primary-color)}

        input{width:100%;padding:14px;margin:10px 0;border:1px solid var(--border-color);border-radius:8px;background-color:var(--surface-highlight-color);color:var(--text-color);box-sizing:border-box;font-size:1rem;transition:all .3s}
        input:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(90, 135, 208, 0.2)}

        button{width:100%;padding:14px;background-color:var(--primary-color);border:none;color:white;font-weight:bold;border-radius:8px;cursor:pointer;margin-top:1rem;font-size:1rem;transition:all .3s;text-transform:uppercase;letter-spacing:1px}
        button:hover{background-color:#4a77c0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(90, 135, 208, 0.3)}
        button:disabled { background-color: #555; cursor: not-allowed; }

        .message{margin:1rem 0;padding:.75rem;border-radius:6px;font-size:.9rem;display:none; border-width: 1px; border-style: solid;}
        .success{background-color:rgba(100, 181, 142, 0.15);color:var(--tertiary-color);border-color:var(--tertiary-color)}
        .error{background-color:rgba(90, 135, 208, 0.15);color:var(--primary-color);border-color:var(--primary-color)}

        .text-link{margin-top:15px;font-size:14px}
        .text-link a{color:var(--primary-color);text-decoration:none}
        .text-link a:hover{text-decoration:underline}

        @keyframes pulse{0%{box-shadow:0 8px 20px rgba(90, 135, 208, 0.1)}50%{box-shadow:0 8px 25px rgba(90, 135, 208, 0.15)}100%{box-shadow:0 8px 20px rgba(90, 135, 208, 0.1)}}
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-logo">
        <a href="main.html"><img src="images/logooo.png" alt="Василёк Logo"></a>
    </div>
    <div class="navbar-links">
        <a href="login.html">Вход</a>
        <a href="register.html">Регистрация</a>
    </div>
</nav>
<div class="container">
    <h1>Восстановить пароль</h1>
    <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 1rem;">Введите email, связанный с вашим аккаунтом, и мы отправим вам ссылку для сброса пароля.</p>
    <div id="message" class="message"></div>

    <form id="forgot-password-form">
        <input type="email" id="email" name="email" placeholder="Электронная почта" required>
        <button type="submit" id="submit-btn">Отправить ссылку</button>
    </form>
    <p class="text-link"><a href="login.html">Вернуться ко входу</a></p>
</div>

<script>
    document.getElementById("forgot-password-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const messageElement = document.getElementById("message");
        const submitBtn = document.getElementById("submit-btn");
        messageElement.style.display = "none";
        submitBtn.disabled = true;

        try {
            const response = await fetch(`http://localhost:8080/api/auth/forgot-password?email=${encodeURIComponent(email)}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            if (response.ok) {
                const successMessage = await response.text();
                messageElement.textContent = successMessage;
                messageElement.className = "message success";
                document.getElementById("forgot-password-form").reset();
            } else {
                const errorResult = await response.json().catch(() => ({}));
                messageElement.textContent = "Ошибка: " + (errorResult.data?.message || errorResult.message || "Не удалось отправить ссылку. Проверьте email.");
                messageElement.className = "message error";
            }
        } catch (error) {
            console.error("Network or parsing error:", error);
            messageElement.textContent = "Ошибка сети или ответа сервера. Попробуйте позже.";
            messageElement.className = "message error";
        }
        submitBtn.disabled = false;
        messageElement.style.display = "block";
    });
</script>
</body>
</html>
